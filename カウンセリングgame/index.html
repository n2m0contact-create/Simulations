<!DOCTYPE html>

<html lang="ja">



<head>
    <meta charset="UTF-8" />
    <title>カウンセリング</title>

    <link rel="stylesheet" href="game.css" />

</head>

<body>

    <div class="start-screen">
        <img class="shutter" src="images/shutter.png">
        <img class="file" src="images/fileA.png" id="fileA">
        <img class="file" src="images/fileB.png" id="fileB">
        <div class="shutter" id="startGame">業務開始</div>

    </div>

    <div class="game">
        <img class="wall" src="images/wall.png">

        <div class="window">
            <div class="background"></div>
            <img class="character" id="character">
        </div>

        <img class="frame" src="images/frame.png">

    </div>

    <div class="textbox">
        <div id="text"></div>
        <div id="choices"></div>
        <div id="next-indicator">▼</div>
    </div>

    <button onclick="endGame()">業務終了</button>

    <script src="シナリオ.js"></script>
    <script src="game.js"></script>
</body>
